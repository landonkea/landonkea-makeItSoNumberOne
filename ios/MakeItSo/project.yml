# ── project.yml — xcodegen spec for MakeItSo (iOS) ──────────────
# This file is the SOURCE of truth for the Xcode project.
# To regenerate the .xcodeproj after changing this file:
#     xcodegen generate

# "name:" is the Xcode project name (becomes .xcodeproj folder name).
name: MakeItSo

# "options:" controls how the project is generated.
options:
  # Minimum iOS version this app supports.
  deploymentTarget:
    iOS: "17.0"

# "configs:" declares the build configurations available to targets
# and schemes. xcodegen's default (an implicit Debug/Release pair)
# only covers two of the three CI build channels this repo now has
# (.github/workflows/build-channels.yml), so "Beta" is added here as
# a third, release-optimized configuration distinct from "Release"
# only in the per-config settings below (bundle ID suffix). Debug
# stays a real "debug" type config (no optimization, assertions on);
# Beta and Release are both "release" type (optimized) so a beta
# tester sees the same compiler output production will ship.
configs:
  Debug: debug
  Beta: release
  Release: release

# "packages:" declares remote Swift Package dependencies.
packages:
  # Porcupine is Picovoice's on-device wake word engine.
  # We use it to detect the word "Computer" (matches the desktop app).
  Porcupine:
    # The GitHub repo that hosts the Porcupine iOS package.
    url: https://github.com/Picovoice/porcupine.git
    # Use any 3.x release (semantic versioning: >=3.0.0, <4.0.0).
    from: "3.0.0"

# "targets:" defines what gets built.
targets:
  # "MakeItSo:" is the app target name.
  MakeItSo:
    # "type: application" makes this build into an installable .app.
    type: application
    # "platform: iOS" means this builds for iPhones and iPads.
    platform: iOS
    # "sources:" lists the Swift files + resources that belong to this app.
    sources:
      # Each Swift source file is listed explicitly so the project
      # structure stays clean (no broad folder globs that can create
      # duplicate group memberships).
      - path: MakeItSoApp.swift
      - path: ContentView.swift
      - path: SpeechManager.swift
      - path: ClaudeService.swift
      - path: TTSService.swift
      - path: ActionRouter.swift
      - path: WakeWordService.swift
      - path: SettingsStore.swift
      - path: SettingsView.swift
      # The Resources folder holds the chime sound, system prompt,
      # and Info.plist — bundled into the app automatically.
      - path: Resources
    # "settings:" applies build settings to this target.
    settings:
      base:
        # The unique bundle identifier for the app.
        PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.MakeItSo
        # Point Xcode at our hand-written Info.plist (holds the mic
        # and speech-recognition usage descriptions required by iOS).
        INFOPLIST_FILE: Resources/Info.plist
        # Generate the launch screen using the system default.
        GENERATE_INFOPLIST_FILE: YES
        # The app entry point uses SwiftUI's @main — no storyboard needed.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The app uses the microphone + speech recognition — those
        # plist usage descriptions are already in Resources/Info.plist.
        SUPPORTS_MACCATALYST: NO
        # Build only for the device architectures Xcode runs on.
        ONLY_ACTIVE_ARCH: YES
        # Enable testability only for debug builds.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # Per-config overrides, same channel convention Android's
      # applicationIdSuffix uses: Debug/Beta get a suffixed bundle ID
      # so all three channels could install side by side on one
      # device once each is actually signed; Release keeps the bare
      # identifier.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.MakeItSo.debug
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.MakeItSo.beta
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.MakeItSo
    # "dependencies:" lists frameworks/libraries the app links against.
    dependencies:
      # Porcupine — the on-device wake word engine ("Computer").
      # The product name matches what `import Porcupine` expects.
      # Limited to iOS because the Porcupine package is iOS-only.
      - package: Porcupine
        product: Porcupine
        platforms: [iOS]
      # Speech — SFSpeechRecognizer for transcribing voice commands.
      - sdk: Speech.framework
      # AVFoundation — audio recording + text-to-speech (AVAudioSession).
      - sdk: AVFoundation.framework

  # "MakeItSoTests:" the unit test bundle. Tests/MakeItSoTests/
  # (ClaudeServiceParsingTests.swift, SettingsStoreTests.swift) has
  # existed since these tests were written, but with no target here
  # to build it and no `test:` action on the scheme below to run it,
  # `xcodebuild test` had nothing to do ("is not currently configured
  # for the test action") and scripts/run_all_tests.sh's iOS section
  # has been silently reporting SKIPPED ever since, not because the
  # tests fail, but because they have never once actually run.
  MakeItSoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MakeItSoTests
    settings:
      base:
        # Uses @testable import MakeItSo (see the test files' own
        # header comments), so it must build against MakeItSo's
        # actual bundle identifier, not a second, separate one.
        PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.MakeItSo.tests
        # Unlike the MakeItSo app target, this bundle has no
        # hand-written Info.plist of its own (Resources/Info.plist
        # belongs to the app target only), so it needs one generated
        # automatically or code signing fails outright.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      # host_target: this bundle runs INSIDE the MakeItSo app process
      # (required for @testable import to see MakeItSo's internal
      # types), rather than as a freestanding test bundle.
      - target: MakeItSo
        embed: false

# "schemes:" defines run/test schemes for Xcode's toolbar.
schemes:
  # The scheme name shown in Xcode's scheme picker.
  MakeItSo:
    # "build:" configures which targets build in this scheme.
    build:
      targets:
        MakeItSo: all
        # "[test]" marks this target as test-only in this scheme, it
        # builds for `xcodebuild test` but not for a plain `build`/`run`.
        MakeItSoTests: [test]
    # "test:" configures which target(s) `xcodebuild test` runs.
    test:
      config: Debug
      targets:
        - MakeItSoTests
    # "run:" configures how the app launches (on the simulator).
    run:
      config: Debug
