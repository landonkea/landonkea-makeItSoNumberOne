name: Build Channels

# Three CI build channels, standing in for dev/staging/prod on an app
# with no server to deploy: a push to `dev` produces unsigned debug
# builds for quick manual sideloading, a pre-release tag (anything
# with a "-" in it, e.g. v1.3.0-beta.1 or v1.3.0-rc1) produces beta
# builds, and a plain stable tag (v1.3.0) produces release builds.
#
# None of these are signed or published anywhere. Android's release
# APK is unsigned (no keystore is committed, see app/build.gradle.kts),
# and iOS's beta/release jobs produce an unsigned .xcarchive .app
# (no Apple Developer certificate available in this environment) —
# both need a human to sign them with real credentials before they
# can go on a device or into a store. That's intentional, see
# BUILD_LOG.md section 3.
on:
  push:
    branches: [dev]
    tags: ["v*"]

jobs:
  # ── Figure out which channel this push is, once, so the three
  # platform jobs below don't each duplicate the same ref-parsing. ──
  determine-channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.determine.outputs.channel }}
    steps:
      - name: Determine build channel from the ref that triggered this run
        id: determine
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "channel=debug" >> "$GITHUB_OUTPUT"
            echo "Branch push to dev -> debug channel"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *-* ]]; then
              # Any hyphen after the version core marks a semver
              # pre-release (v1.3.0-beta.1, v1.3.0-rc1, ...).
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "Pre-release tag $TAG -> beta channel"
            else
              echo "channel=release" >> "$GITHUB_OUTPUT"
              echo "Stable tag $TAG -> release channel"
            fi
          else
            echo "channel=" >> "$GITHUB_OUTPUT"
            echo "Ref ${{ github.ref }} doesn't match any known channel, skipping"
          fi

  desktop:
    needs: determine-channel
    if: needs.determine-channel.outputs.channel != ''
    strategy:
      fail-fast: false
      # PyInstaller bundles a real interpreter + native deps into a
      # platform-specific binary (see build_pyinstaller.py's own
      # docstring: .app / .exe / no-extension for macOS/Windows/
      # Linux), so unlike Android/iOS this one job needs to actually
      # run on each target OS to produce something a person on that
      # OS can double-click.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHANNEL: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyaudio compiles against PortAudio at install time on Linux/
      # macOS; Windows skips this because PyPI's pyaudio wheels for
      # Windows already bundle PortAudio (same note as BUILD_LOG.md's
      # rebuild instructions).
      - name: Install system audio library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install system audio library (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          cd desktop
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build desktop (${{ needs.determine-channel.outputs.channel }} channel)
        shell: bash
        run: |
          cd desktop
          python build_pyinstaller.py --channel "$CHANNEL"

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ needs.determine-channel.outputs.channel }}
          path: desktop/dist/
          if-no-files-found: error

  android:
    needs: determine-channel
    if: needs.determine-channel.outputs.channel != ''
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Assemble ${{ needs.determine-channel.outputs.channel }} APK
        run: |
          cd android
          chmod +x gradlew
          # Gradle task names are capitalized (assembleDebug,
          # assembleBeta, assembleRelease) — the channel name from
          # determine-channel is already lowercase, so capitalize
          # just the first letter here rather than hardcoding a
          # channel -> task-name map.
          TASK="assemble$(echo "${CHANNEL:0:1}" | tr '[:lower:]' '[:upper:]')${CHANNEL:1}"
          echo "Running ./gradlew $TASK"
          ./gradlew "$TASK"

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.determine-channel.outputs.channel }}
          path: android/app/build/outputs/apk/${{ needs.determine-channel.outputs.channel }}/
          if-no-files-found: error

  ios:
    needs: determine-channel
    if: needs.determine-channel.outputs.channel != ''
    runs-on: macos-latest
    env:
      CHANNEL: ${{ needs.determine-channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          cd ios/MakeItSo
          brew install xcodegen
          xcodegen generate

      # Debug builds (dev-branch pushes) just need to compile and are
      # only ever going to run on a simulator anyway, so this stays a
      # normal simulator build+zip, same as CI's existing iOS job.
      - name: Build for iOS Simulator (debug channel)
        if: needs.determine-channel.outputs.channel == 'debug'
        run: |
          cd ios/MakeItSo
          xcodebuild -scheme MakeItSo -sdk iphonesimulator -configuration Debug build \
            -derivedDataPath "$RUNNER_TEMP/build-output"

      - name: Zip simulator build (debug channel)
        if: needs.determine-channel.outputs.channel == 'debug'
        run: |
          cd "$RUNNER_TEMP/build-output/Build/Products/Debug-iphonesimulator"
          zip -r "$GITHUB_WORKSPACE/MakeItSo-ios-debug-simulator.zip" MakeItSo.app

      # Beta/release channels archive for a real device (arm64, not
      # the simulator) with code signing turned off entirely —
      # there's no Apple Developer certificate in this environment,
      # see BUILD_LOG.md section 3. The .xcarchive this produces has
      # a real unsigned .app inside it that a human can later sign
      # (Xcode Organizer's "re-sign" flow, or `codesign` by hand)
      # once they have their own team/certificate, without needing
      # to rebuild from source.
      - name: Archive unsigned build (${{ needs.determine-channel.outputs.channel }} channel)
        if: needs.determine-channel.outputs.channel == 'beta' || needs.determine-channel.outputs.channel == 'release'
        run: |
          cd ios/MakeItSo
          CONFIG="Beta"
          if [ "$CHANNEL" = "release" ]; then CONFIG="Release"; fi
          xcodebuild archive \
            -scheme MakeItSo \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MakeItSo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Zip unsigned archive (${{ needs.determine-channel.outputs.channel }} channel)
        if: needs.determine-channel.outputs.channel == 'beta' || needs.determine-channel.outputs.channel == 'release'
        run: |
          cd "$RUNNER_TEMP/MakeItSo.xcarchive/Products/Applications"
          zip -r "$GITHUB_WORKSPACE/MakeItSo-ios-${CHANNEL}-unsigned.zip" MakeItSo.app

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.determine-channel.outputs.channel }}
          path: MakeItSo-ios-*.zip
          if-no-files-found: error
