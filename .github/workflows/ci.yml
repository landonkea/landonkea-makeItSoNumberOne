name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyaudio (in requirements.txt) compiles a C extension against
      # PortAudio at install time — without this system library present,
      # pip's build step fails with "portaudio.h: No such file or
      # directory" before it ever gets to Python code.
      - name: Install system audio library (required to build pyaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          cd desktop
          pip install -r requirements.txt

      - name: Compile-check desktop Python sources
        run: |
          cd desktop
          find . -name "*.py" -print0 | xargs -0 python3 -m py_compile

      - name: Run desktop tests and generate report
        run: scripts/run_all_tests.sh desktop

      # ── Container build + smoke test (additive — text mode only) ──
      # Builds the text-mode-only Docker image (see desktop/Dockerfile
      # for why voice mode can't run in a container) and runs a real
      # conversation turn through it: a routines.yaml macro trigger,
      # matched and executed end to end through core/routines.py and
      # core/action_router.py, with no AI API key required (routines
      # skip the AI round-trip entirely — see core/routines.py) so
      # this smoke test stays deterministic and free in CI.
      - name: Build desktop Docker image
        run: docker build -f desktop/Dockerfile -t make-it-so-desktop:ci .

      - name: Smoke test desktop container (text mode)
        run: |
          printf 'focus time\nexit\n' | docker run --rm -i \
            -v "$PWD/desktop/routines.example.yaml:/app/desktop/routines.yaml:ro" \
            make-it-so-desktop:ci | tee /tmp/desktop-smoke.log
          grep -q "Entering sleep mode" /tmp/desktop-smoke.log

      - name: Upload desktop test-results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-desktop
          path: test-results/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Kotlin (debug + release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew compileDebugKotlin compileReleaseKotlin

      - name: Run android tests and generate report
        run: scripts/run_all_tests.sh android

      - name: Upload android test-results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-android
          path: test-results/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          cd ios/MakeItSo
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator
        run: |
          cd ios/MakeItSo
          xcodebuild -scheme MakeItSo -sdk iphonesimulator build

      - name: Run iOS tests and generate report
        run: scripts/run_all_tests.sh ios

      - name: Upload iOS test-results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios
          path: test-results/
