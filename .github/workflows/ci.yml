name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd desktop
          pip install -r requirements.txt

      - name: Compile-check desktop Python sources
        run: |
          cd desktop
          find . -name "*.py" -print0 | xargs -0 python3 -m py_compile

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Kotlin (debug + release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew compileDebugKotlin compileReleaseKotlin

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          cd ios/MakeItSo
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator
        run: |
          cd ios/MakeItSo
          xcodebuild -scheme MakeItSo -sdk iphonesimulator build
